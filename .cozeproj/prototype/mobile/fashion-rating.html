<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 字体（按需，系统字体时省略；只能用 Google 字体，CSS 地址前缀：https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google） -->
  <!-- <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/> -->

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色（天命穿搭：深藏青黑主色，东方玄学 × 轻奢质感） === */
      --color-primary:              #0f172a;
      --color-primary-container:    #1e293b;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（白底 + 中性 gray 色阶，与现有产品一致） === */
      --color-background:                 #ffffff;
      --color-surface-container-lowest:   #ffffff;
      --color-surface:                    #ffffff;
      --color-surface-container:          #f9fafb;
      --color-surface-container-high:     #f1f5f9;
      --color-surface-container-highest:  #e5e7eb;
      /* === 文字 === */
      --color-on-surface:           #111827;
      --color-on-surface-variant:   #6b7280;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 边框 === */
      --color-outline:          #d1d5db;
      --color-outline-variant:  #e5e7eb;
      /* === 圆角 === */
      --radius-sm:   0.5rem;
      --radius-md:   0.75rem;
      --radius-lg:   1rem;
      --radius-xl:   1.25rem;
      --radius-2xl:  1.5rem;
      --radius-full: 9999px;
      /* === 阴影（克制柔和） === */
      --shadow-card:   0 4px 12px rgba(0,0,0,0.08);
      --shadow-float:  0 10px 25px rgba(0,0,0,0.10);
      --shadow-dialog: 0 25px 50px rgba(0,0,0,0.16);
      /* === 字体 === */
      --font-sans: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans flex flex-col">

  <!-- 本页面无自定义 header / 底部 TabBar（微信原生导航栏承载标题），@nav 段不复制 -->

  <main class="flex-1 flex flex-col">
    <!-- @main-content:start -->

    <!-- 标题区 -->
    <div id="title-area" class="pt-10 text-center px-4">
      <h1 class="text-xl font-semibold text-on-surface">AI 毒舌时尚官</h1>
      <p class="text-xs text-on-surface-variant mt-2">上传穿搭照片，AI 毒舌打分</p>
    </div>

    <!-- 上传卡片区：整卡可点击，3:4 竖版虚线卡片 -->
    <div id="card-upload"
         class="w-[62%] aspect-[3/4] mx-auto mt-8 bg-white border-2 border-dashed border-outline rounded-2xl
                flex flex-col items-center justify-center cursor-pointer active:scale-[0.98] transition-transform">
      <i data-lucide="plus" class="w-8 h-8 text-primary"></i>
      <p class="text-base font-semibold text-on-surface mt-3">上传穿搭照片</p>
    </div>

    <!-- 上传方式提示 -->
    <p id="upload-hint" class="text-xs text-on-surface-variant mt-4 text-center">拍照或从相册选择</p>

    <!-- 剩余次数：跟随上传卡，同步上移 -->
    <p id="remaining-count" class="text-xs text-on-surface-variant text-center mt-6">今日还可测 3 次</p>

    <!-- @main-content:end -->
  </main>

  <script>
    /* 导航辅助函数（Mobile 每页必须定义，原型演示用） */
    function navPush(route) {
      console.log(`[原型演示] PUSH 到: ${route}`);
      window.location.href = route;
    }
    function navReplace(route) {
      console.log(`[原型演示] REPLACE 为: ${route}`);
      window.location.replace(route);
    }
    function navReset(route) {
      console.log(`[原型演示] RESET 到: ${route}`);
      window.location.href = route;
    }
    function navBack() {
      console.log(`[原型演示] BACK 返回上一页`);
      if (window.history.length > 1) window.history.back();
    }

    $(function () {
      // 上传卡片 - 点击后应调起微信原生图片选择能力（拍照或从相册选择），属于原生/第三方接口：
      // 原型阶段仅保留事件入口并输出日志。完整行为：
      // 1. 调用 wx.chooseMedia（或 wx.chooseImage）选择 1 张穿搭照片
      // 2. 选择成功后将图片上传并进入 AI 毒舌测评流程
      // 3. 测评完成后扣减当日剩余次数，更新「今日还可测 N 次」
      $('#card-upload').on('click', function () {
        console.log('需要调用微信原生接口 wx.chooseMedia 实现拍照或从相册选择穿搭照片');
      });
    });
  </script>
  <script>lucide.createIcons();</script>
</body>

</html>
