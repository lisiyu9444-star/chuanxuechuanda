  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色（轻奢风：墨黑 CTA + 金色点缀） === */
      --color-primary:              #101010;
      --color-primary-container:    #B9975B;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（暖象牙白 + 中性暖调色阶） === */
      --color-background:                 #F8F4EC;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FCFAF5;
      --color-surface-container:          #F0EADD;
      --color-surface-container-high:     #E8E1D2;
      --color-surface-container-highest:  #DFD7C6;
      /* === 文字 === */
      --color-on-surface:           #1B1712;
      --color-on-surface-variant:   #7B7164;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 边框（暖灰，使用需 /10~/30 透明度弱化） === */
      --color-outline:          #8F8578;
      --color-outline-variant:  #CFC7B8;
      /* === 圆角（轻奢克制，小圆角精致感） === */
      --radius-sm:   0.25rem;
      --radius-md:   0.375rem;
      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;
      --radius-full: 9999px;
      /* === 阴影（暖调柔和） === */

      --shadow-float:  0 10px 25px rgba(27,23,18,0.08);

      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-display: "Playfair Display", "Noto Serif SC", Georgia, serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>

  <script>
    // ===== 导航辅助函数 =====
    function navPush(route) {
      console.log(`[原型演示] PUSH 到: ${route}`);
      window.location.href = route;
    }
    function navReplace(route) {
      console.log(`[原型演示] REPLACE 为: ${route}`);
      window.location.replace(route);
    }
    function navReset(route) {
      console.log(`[原型演示] RESET 到: ${route}`);
      window.location.href = route;
    }
    function navBack() {
      console.log(`[原型演示] BACK 返回上一页`);
      if (window.history.length > 1) window.history.back();
    }

    // 通用 Toast：设置文案后短暂展示
    function showToast(text) {
      const $toast = $('#toast');
      $toast.text(text).stop(true, true).removeClass('hidden').hide()
            .fadeIn(200).delay(1500).fadeOut(300);
    }

    // ===== 回纹（雷纹）圆环生成 =====
    // 连续 Greek key 单元沿圆周等角排列，映射到极坐标生成 path；
    // 所有 .greek-ring 共用同一几何（120 viewBox / R50 / 带宽 14 / 20 单元）。
    // 开发落地：同一算法可在小程序 canvas 上以折线段复用绘制。
    function buildGreekRing(cx, cy, R, band, units) {
      const motif = [
        [0, 0.5], [0.8, 0.5], [0.8, 0.15], [0.25, 0.15], [0.25, 0.65],
        [0.55, 0.65], [0.55, 0.35], [0.4, 0.35], [0.4, 0.5], [1, 0.5]
      ];
      const step = (Math.PI * 2) / units;
      let d = '';
      for (let u = 0; u < units; u++) {
        motif.forEach(function (pt, i) {
          const ang = (u + pt[0]) * step - Math.PI / 2;
          const r = R + (pt[1] - 0.5) * band;
          const x = (cx + r * Math.cos(ang)).toFixed(2);
          const y = (cy + r * Math.sin(ang)).toFixed(2);
          d += (u === 0 && i === 0 ? 'M' : 'L') + x + ' ' + y;
        });
      }
      return d + 'Z';
    }
    const greekRingD = buildGreekRing(60, 60, 50, 14, 20);

    $(function () {
      // 填充全部印章的回纹环（主海报 1 枚 + 色阶预览 4 枚）
      $('.greek-ring').attr('d', greekRingD);

      // 再测一次：回到测评页上传态（Tab 内流程切换，用 RESET 归位）
      $('#btn-retry').on('click', function () {
        navReset('fashion-rating.html');
      });

      // 保存卡片：Toast 反馈
      // 完整实现说明（后续开发）：
      // 1. 小程序端：canvas 2d 绘制黑色结果海报（照片 + 底部渐隐 + 分数 + 等级 + 风格人格 + 毒舌点评），
      //    canvasToTempFilePath（2x）后 saveImageToPhotosAlbum 存入相册；
      // 2. 失败降级 toast「请长按截图保存」；H5 端直接提示长按截图。
      $('#btn-save-card').on('click', function () {
        showToast('已保存到相册');
      });

      // 分享好友：小程序内通过右上角胶囊/按钮触发 useShareAppMessage，原型以 Toast 提示
      $('#btn-share').on('click', function () {
        showToast('小程序内点击右上角分享给好友');
      });

      // TabBar：测评已激活；首页/我的为既有小程序页面，原型中不可点
      $('#nav-rating').on('click', function (e) {
        e.preventDefault();
      });
      $('#nav-home').on('click', function (e) {
        e.preventDefault();
        console.log('[原型演示] 首页为既有页面，本原型不提供跳转');
      });
      $('#nav-profile').on('click', function (e) {
        e.preventDefault();
        console.log('[原型演示] 我的为既有页面，本原型不提供跳转');
      });
    });
  </script>
