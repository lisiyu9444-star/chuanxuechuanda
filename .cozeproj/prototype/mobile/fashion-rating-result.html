<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- 字体（Google 字体） -->
  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色（轻奢风：墨黑 CTA + 金色点缀） === */
      --color-primary:              #101010;
      --color-primary-container:    #B9975B;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（暖象牙白 + 中性暖调色阶） === */
      --color-background:                 #F8F4EC;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FCFAF5;
      --color-surface-container:          #F0EADD;
      --color-surface-container-high:     #E8E1D2;
      --color-surface-container-highest:  #DFD7C6;
      /* === 文字 === */
      --color-on-surface:           #1B1712;
      --color-on-surface-variant:   #7B7164;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 边框（暖灰，使用需 /10~/30 透明度弱化） === */
      --color-outline:          #8F8578;
      --color-outline-variant:  #CFC7B8;
      /* === 圆角（轻奢克制，小圆角精致感） === */
      --radius-sm:   0.25rem;
      --radius-md:   0.375rem;
      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;
      --radius-full: 9999px;
      /* === 阴影（暖调柔和） === */
      --shadow-card:   0 4px 12px rgba(27,23,18,0.06);
      --shadow-float:  0 10px 25px rgba(27,23,18,0.08);
      --shadow-dialog: 0 25px 50px rgba(27,23,18,0.12);
      /* === 字体（正文优雅无衬线；标题用高反差衬线 font-display 局部使用） === */
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-display: "Playfair Display", "Noto Serif SC", Georgia, serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans flex flex-col">

  <!-- @nav:start 导航组件，不需要的页面则不要复制此段（从 @nav:start 到 @nav:end） -->
  <!-- 一级页 Header：标题居中，轻奢风字距拉开；二级页由子 Agent 改为「返回按钮 + 标题」形态 -->
  <header class="bg-background sticky top-0 z-40 h-14 flex items-center justify-center px-4">
    <h1 class="text-base font-semibold tracking-[0.3em] text-on-surface">测 评</h1>
  </header>
  <!-- 底部 TabBar：3 个一级页（首页为既有页面，本原型仅测评可点） -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-surface-container-lowest border-t border-outline-variant/20
              flex justify-around items-center h-14 pb-[env(safe-area-inset-bottom)]">
    <a href="#" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant
                       hover:text-on-surface transition-colors">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">首页</span>
    </a>
    <a href="fashion-rating.html" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-primary"
       aria-current="page">
      <i data-lucide="sparkles" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">测评</span>
    </a>
    <a href="#" class="flex flex-col items-center gap-0.5 px-5 py-1.5 text-on-surface-variant
                       hover:text-on-surface transition-colors">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold tracking-wide">我的</span>
    </a>
  </nav>
  <!-- @nav:end 导航组件，不需要的页面则不要复制此段 -->

  <main class="flex-1 overflow-y-auto pb-[calc(3.5rem+env(safe-area-inset-bottom))]">
    <!-- @main-content:start -->

    <!-- 杂志风结果海报：大量留白 + 居中大图 + 超大分数 + 等级人格 + 毒舌点评 -->
    <section class="px-4 pt-10 pb-12 flex flex-col items-center">

      <!-- 海报照片区：竖版 3:4 大图（宽约 62%），右下角覆盖超大分数圆衬 -->
      <div id="poster-photo-wrap" class="relative w-[62%]">
        <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f"
             alt="年轻女性时尚街拍穿搭照" data-category="服饰时尚"
             class="w-full aspect-[3/4] object-cover rounded-xl shadow-float"/>
        <!-- 超大分数：象牙色圆形底衬，半边压图半边在图外 -->
        <div id="poster-score"
             class="absolute -bottom-7 -right-7 w-24 h-24 rounded-full bg-surface shadow-float
                    flex flex-col items-center justify-center">
          <span class="font-display text-5xl leading-none text-on-surface">82</span>
          <span class="text-[10px] tracking-[0.2em] text-on-surface-variant mt-1">分</span>
        </div>
      </div>

      <!-- 等级 · 副标题 -->
      <p id="poster-level" class="mt-14 text-base font-semibold text-on-surface text-center">
        时尚达人 · 街拍潜力股
      </p>

      <!-- 风格人格：衬线大标题 + 两侧金色短线装饰 -->
      <div id="poster-personality" class="mt-3 flex items-center justify-center gap-3">
        <span class="w-6 h-px bg-primary-container"></span>
        <span class="font-display text-2xl text-on-surface">撞色冒险家</span>
        <span class="w-6 h-px bg-primary-container"></span>
      </div>

      <!-- 毒舌点评：斜体居中，限两行宽度 -->
      <p id="poster-comment"
         class="mt-4 text-sm italic text-on-surface-variant text-center leading-relaxed max-w-[16rem]">
        “鞋子出卖了你——换个乐福鞋，你就是这条街最靓的仔。”
      </p>

      <!-- 极简分隔线：暖灰细线 + 中间金色小菱形 -->
      <div id="poster-divider" class="mt-8 flex items-center justify-center gap-2">
        <span class="w-16 h-px bg-outline-variant/40"></span>
        <span class="w-1.5 h-1.5 rotate-45 bg-primary-container"></span>
        <span class="w-16 h-px bg-outline-variant/40"></span>
      </div>

      <!-- 操作区：两个纯文字链接，字间距拉开 -->
      <div id="poster-actions" class="mt-8 flex items-center justify-center gap-12">
        <button id="btn-save-card" type="button"
                class="min-w-12 min-h-12 flex items-center justify-center text-sm tracking-[0.2em] text-on-surface
                       hover:text-primary-container transition-colors">保存卡片</button>
        <button id="btn-retry" type="button"
                class="min-w-12 min-h-12 flex items-center justify-center text-sm tracking-[0.2em] text-on-surface
                       hover:text-primary-container transition-colors">再测一次</button>
      </div>

      <!-- 主 CTA：细线边框胶囊按钮（轻奢感，宽度约 60%） -->
      <button id="btn-share" type="button"
              class="mt-8 w-[60%] rounded-full border border-on-surface/30 bg-transparent
                     py-3 text-sm tracking-[0.2em] text-on-surface
                     hover:border-on-surface/60 active:scale-[0.98] transition-all">
        分享好友，挑战 TA
      </button>

    </section>

    <!-- Toast 提示（保存卡片反馈） -->
    <div id="toast-save"
         class="fixed left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-50 hidden
                bg-on-surface/90 text-on-primary text-sm px-5 py-2.5 rounded-full shadow-dialog">
      已保存到相册
    </div>

    <!-- @main-content:end -->
  </main>

  <script>lucide.createIcons();</script>

  <script>
    // ===== 导航辅助函数 =====
    function navPush(route) {
      console.log(`[原型演示] PUSH 到: ${route}`);
      window.location.href = route;
    }
    function navReplace(route) {
      console.log(`[原型演示] REPLACE 为: ${route}`);
      window.location.replace(route);
    }
    function navReset(route) {
      console.log(`[原型演示] RESET 到: ${route}`);
      window.location.href = route;
    }
    function navBack() {
      console.log(`[原型演示] BACK 返回上一页`);
      if (window.history.length > 1) window.history.back();
    }

    $(function () {
      // 再测一次：回到测评页上传态（Tab 内流程切换，用 RESET 归位）
      $('#btn-retry').on('click', function () {
        navReset('fashion-rating.html');
      });

      // 保存卡片：显示短暂 Toast「已保存到相册」
      // 完整实现说明（后续开发）：
      // 1. 小程序端：canvas 2d 绘制结果海报（照片 + 分数 + 等级 + 风格人格 + 毒舌点评），
      //    canvasToTempFilePath（2x）后 saveImageToPhotosAlbum 存入相册；
      // 2. 失败降级 toast「请长按截图保存」；H5 端直接提示长按截图。
      $('#btn-save-card').on('click', function () {
        const $toast = $('#toast-save');
        $toast.stop(true, true).removeClass('hidden').hide().fadeIn(200)
              .delay(1500).fadeOut(300);
      });

      // 分享好友：原型无跳转；完整实现为唤起微信转发
      // 1. 小程序端：Taro.useShareAppMessage，title 拼「82 分 · 撞色冒险家」，path 带 referrer 参数；
      // 2. H5 端隐藏该按钮。
      $('#btn-share').on('click', function () {
        console.log('需要调用微信转发能力：标题含分数+风格人格，path 带 referrer');
      });
    });
  </script>
</body>

</html>
