<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- 字体（Google 字体） -->
  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色（轻奢风：墨黑 CTA + 金色点缀） === */
      --color-primary:              #101010;
      --color-primary-container:    #B9975B;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面（暖象牙白 + 中性暖调色阶） === */
      --color-background:                 #F8F4EC;
      --color-surface-container-lowest:   #FFFFFF;
      --color-surface:                    #FCFAF5;
      --color-surface-container:          #F0EADD;
      --color-surface-container-high:     #E8E1D2;
      --color-surface-container-highest:  #DFD7C6;
      /* === 文字 === */
      --color-on-surface:           #1B1712;
      --color-on-surface-variant:   #7B7164;
      /* === 功能色 === */
      --color-success:  #22c55e;
      --color-error:    #ef4444;
      --color-warning:  #f59e0b;
      /* === 边框（暖灰，使用需 /10~/30 透明度弱化） === */
      --color-outline:          #8F8578;
      --color-outline-variant:  #CFC7B8;
      /* === 圆角（轻奢克制，小圆角精致感） === */
      --radius-sm:   0.25rem;
      --radius-md:   0.375rem;
      --radius-lg:   0.5rem;
      --radius-xl:   0.75rem;
      --radius-2xl:  1rem;
      --radius-full: 9999px;
      /* === 阴影（暖调柔和） === */
      --shadow-card:   0 4px 12px rgba(27,23,18,0.06);
      --shadow-float:  0 10px 25px rgba(27,23,18,0.08);
      --shadow-dialog: 0 25px 50px rgba(27,23,18,0.12);
      /* === 字体（正文优雅无衬线；标题用高反差衬线 font-display 局部使用） === */
      --font-sans: "Noto Sans SC", system-ui, sans-serif;
      --font-display: "Playfair Display", "Noto Serif SC", Georgia, serif;
    }
  </style>

  <style>
    body {
      min-height: max(812px, 100dvh);
      font-family: system-ui, sans-serif;
    }
    /* 照片扫描光带：自上而下循环扫过，营造「AI 审视中」感 */
    #scan-line {
      top: -25%;
      animation: scanY 2.2s ease-in-out infinite;
    }
    @keyframes scanY {
      0%   { top: -25%; }
      50%  { top: 105%; }
      100% { top: -25%; }
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-black text-white font-sans">

  <!-- 全屏深色 Loading：与结果海报同色系衔接；右上角取消，无 Header/TabBar -->
  <button id="btn-cancel" type="button" aria-label="取消"
          class="absolute top-4 right-4 z-40 w-12 h-12 flex items-center justify-center text-white/60
                 hover:text-white transition-colors">
    <i data-lucide="x" class="w-5 h-5"></i>
  </button>

  <main class="min-h-[100dvh] flex flex-col items-center justify-center px-8">
    <!-- @main-content:start -->

    <!-- 上传照片：金色微光环绕 + 扫描光带循环 -->
    <div id="loading-photo"
         class="relative w-44 rounded-2xl overflow-hidden border border-white/10
                shadow-[0_0_60px_rgba(185,151,91,0.18)]">
      <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f"
           alt="年轻女性时尚街拍穿搭照" data-category="服饰时尚"
           class="w-full aspect-[3/4] object-cover"/>
      <div id="scan-line"
           class="absolute inset-x-0 h-14 bg-gradient-to-b from-transparent via-white/25 to-transparent"></div>
    </div>

    <!-- 加载指示：细环旋转 -->
    <div class="mt-9 w-5 h-5 rounded-full border border-white/15 border-t-white/70 animate-spin"></div>

    <!-- 毒舌文案轮播：PRD 8 条，每 2.5 秒淡入淡出切换 -->
    <p id="loading-text" class="mt-4 h-6 text-sm text-white/80 text-center">
      正在用毒辣眼光审视你的穿搭...
    </p>

    <!-- @main-content:end -->
  </main>

  <!-- 底部提示 -->
  <p class="fixed bottom-10 inset-x-0 text-center text-xs text-white/30">
    AI 点评生成中，约需 5-15 秒
  </p>

  <script>lucide.createIcons();</script>

  <script>
    // ===== 导航辅助函数 =====
    function navPush(route) {
      console.log(`[原型演示] PUSH 到: ${route}`);
      window.location.href = route;
    }
    function navReplace(route) {
      console.log(`[原型演示] REPLACE 为: ${route}`);
      window.location.replace(route);
    }
    function navReset(route) {
      console.log(`[原型演示] RESET 到: ${route}`);
      window.location.href = route;
    }
    function navBack() {
      console.log(`[原型演示] BACK 返回上一页，中断本次评分请求`);
      if (window.history.length > 1) window.history.back();
    }

    // PRD 4.2 毒舌官人设文案：每 2.5 秒切换一条，淡入淡出
    var LOADING_TEXTS = [
      '正在用毒辣眼光审视你的穿搭...',
      '时尚雷达扫描中...',
      '评审官正在皱眉...',
      '正在分析你的色彩搭配...',
      '计算你的时尚指数...',
      '这件单品的版型...嗯...',
      '让我看看你的个性表达...',
      '时尚评分即将出炉...'
    ];

    $(function () {
      var idx = 0;
      var $text = $('#loading-text');
      setInterval(function () {
        $text.fadeOut(250, function () {
          idx = (idx + 1) % LOADING_TEXTS.length;
          $text.text(LOADING_TEXTS[idx]).fadeIn(250);
        });
      }, 2500);

      // 原型演示：约 7.5 秒（轮播 3 条）后自动出结果
      // 完整实现（后续开发）：上传 fashion_pending_image 发起评分请求，
      // 成功写入 fashion_latest_result 后 navigateBack 回测评页切结果态；
      // 取消时 abort 请求并 toast「已取消」。
      setTimeout(function () {
        navReplace('fashion-rating-result.html');
      }, 7600);

      // 取消：返回测评页上传态
      $('#btn-cancel').on('click', function () {
        navBack();
      });
    });
  </script>

</body>

</html>
